name: Build iOS App

# MANUAL TRIGGER ONLY - No automatic conflicts with Vercel web deployment
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
        - release
        - debug
      export_method:
        description: 'Export method'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - ad-hoc
        - app-store
        - enterprise

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.6'
        channel: 'stable'
        
    - name: Install Flutter dependencies
      run: flutter pub get
      
    - name: Configure API Keys
      env:
        # Use GitHub Secrets for production, fallback to hardcoded for now
        T_BACKEND_API_KEY: ${{ secrets.T_BACKEND_API_KEY || '***REMOVED***' }}
        T_BACKEND_URL: ${{ secrets.T_BACKEND_URL || 'https://api.fluxpointstudios.com' }}
      run: |
        echo "🔍 API Configuration for iOS Build:"
        echo "- Backend URL: $T_BACKEND_URL"
        echo "- API Key configured: ✅ (via dart-define)"
        echo "- Mainnet mode: ✅"
        echo "- This should fix AI API calls in TestFlight builds"
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Setup iOS Simulator (for testing)
      run: |
        xcrun simctl list devices
        
    - name: Setup Code Signing (if release)
      if: github.event.inputs.build_type == 'release'
      env:
        IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Create keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security list-keychains -d user -s build.keychain login.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        
        # Import certificate
        echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
        security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -A
        
        # Import provisioning profile
        echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
        
        # Extract UUID and Name
        security cms -D -i profile.mobileprovision > decoded.plist
        PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' decoded.plist)
        PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' decoded.plist)
        
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
        
        # Allow codesign to access keychain
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        
        # Verify certificate is available
        security find-identity -v -p codesigning build.keychain
        
        # Configure Xcode project for manual signing
        PROFILE_NAME="$PROFILE_NAME" python3 -c "
        import re
        import os
        
        # Read project file
        with open('ios/Runner.xcodeproj/project.pbxproj', 'r') as f:
            content = f.read()
        
        # Get environment variables
        export_method = '${{ github.event.inputs.export_method }}'
        profile_name = os.environ.get('PROFILE_NAME', '')
        code_sign_identity = 'iPhone Developer' if export_method == 'development' else 'iPhone Distribution'
        
        # Add CODE_SIGN_STYLE = Manual after each DEVELOPMENT_TEAM line
        content = re.sub(
            r'(DEVELOPMENT_TEAM = 5G932XX96M;)',
            rf'\1\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"{profile_name}\";',
            content
        )
        
        # Update CODE_SIGN_IDENTITY
        content = re.sub(
            r'\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = \"iPhone Developer\";',
            f'\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"{code_sign_identity}\";',
            content
        )
        
        # Write back
        with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
            f.write(content)
        
        print(f'Configured project with:')
        print(f'  Profile Name: {profile_name}')
        print(f'  Code Sign Identity: {code_sign_identity}')
        print(f'  Export Method: {export_method}')
        "
        
        # Determine signing certificate based on export method
        if [ "${{ github.event.inputs.export_method }}" = "development" ]; then
          SIGNING_CERTIFICATE="Apple Development"
        else
          SIGNING_CERTIFICATE="Apple Distribution"
        fi
        
        # Create ExportOptions.plist for manual signing
        cat << EOF > ExportOptions.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>compileBitcode</key>
            <false/>
            <key>method</key>
            <string>${{ github.event.inputs.export_method }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$SIGNING_CERTIFICATE</string>
            <key>teamID</key>
            <string>5G932XX96M</string>
            <key>provisioningProfiles</key>
            <dict>
                <key>com.bluelight.wallet</key>
                <string>$PROFILE_NAME</string>
            </dict>
        </dict>
        </plist>
        EOF
        
        echo "Profile Name: $PROFILE_NAME"
        echo "Profile UUID: $PROFILE_UUID"
        
        # Debug: Check installed profiles and certificates
        echo "=== Installed Provisioning Profiles ==="
        ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
        
        echo "=== Available Code Signing Identities ==="
        security find-identity -v -p codesigning build.keychain
        
        echo "=== Xcode Project Configuration Check ==="
        grep -A 5 -B 5 "DEVELOPMENT_TEAM\|PROVISIONING_PROFILE_SPECIFIER\|ProvisioningStyle" ios/Runner.xcodeproj/project.pbxproj || true
        
    - name: Build iOS app
      if: github.event.inputs.build_type == 'debug'
      env:
        T_BACKEND_API_KEY: ${{ secrets.T_BACKEND_API_KEY || '***REMOVED***' }}
        T_BACKEND_URL: ${{ secrets.T_BACKEND_URL || 'https://api.fluxpointstudios.com' }}
      run: |
        echo "Building iOS app with type: ${{ github.event.inputs.build_type }}"
        flutter build ios --debug --no-codesign \
          --dart-define=T_BACKEND_API_KEY=$T_BACKEND_API_KEY \
          --dart-define=T_BACKEND_URL=$T_BACKEND_URL \
          --dart-define=IS_MAINNET=true
        
    - name: Build IPA (if release)
      if: github.event.inputs.build_type == 'release'
      env:
        T_BACKEND_API_KEY: ${{ secrets.T_BACKEND_API_KEY || '***REMOVED***' }}
        T_BACKEND_URL: ${{ secrets.T_BACKEND_URL || 'https://api.fluxpointstudios.com' }}
      run: |
        echo "Creating .ipa with export method: ${{ github.event.inputs.export_method }}"
        flutter build ipa --release --export-options-plist=ExportOptions.plist \
          --dart-define=T_BACKEND_API_KEY=$T_BACKEND_API_KEY \
          --dart-define=T_BACKEND_URL=$T_BACKEND_URL \
          --dart-define=IS_MAINNET=true
        
    - name: Cleanup Keychain (if release)
      if: always() && github.event.inputs.build_type == 'release'
      run: |
        security delete-keychain build.keychain || true
        rm -f certificate.p12 profile.mobileprovision decoded.plist ExportOptions.plist || true
      
    - name: Upload iOS build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-${{ github.event.inputs.build_type }}-${{ github.run_number }}
        path: |
          build/ios/iphoneos/Runner.app
          build/ios/ipa/*.ipa
        retention-days: 30
        if-no-files-found: warn
        
    - name: Build Summary
      run: |
        echo "## 🍎 iOS Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Type**: ${{ github.event.inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Export Method**: ${{ github.event.inputs.export_method }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Flutter Version**: 3.32.6" >> $GITHUB_STEP_SUMMARY
        echo "- **Bundle ID**: com.bluelight.wallet" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: 1.0.1+3" >> $GITHUB_STEP_SUMMARY
        echo "- **API Keys**: ✅ Included (fixes TestFlight AI calls)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          echo "📦 Check the 'Artifacts' section below to download your .ipa file" >> $GITHUB_STEP_SUMMARY
        else
          echo "🔧 Debug build completed - no .ipa generated" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "⚠️ **Note**: This workflow does NOT interfere with Vercel web deployment" >> $GITHUB_STEP_SUMMARY 