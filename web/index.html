  <script>
    // Capture OAuth params early (from query or fragment) and persist globally + in sessionStorage
    (function() {
      if (window.location && window.location.pathname === '/smartwallet-oauth') {
        var stored = null;
        try {
          var qs = new URLSearchParams(window.location.search);
          var codeQ = qs.get('code');
          var stateQ = qs.get('state');
          if (codeQ && stateQ) {
            stored = { code: codeQ, state: stateQ };
            console.log('SW OAuth: captured params from query');
          }
        } catch(e) {}
        try {
          if (!stored && window.location.hash && window.location.hash.indexOf('sw_oauth=') >= 0) {
            var fragRaw = window.location.hash;
            var idx = fragRaw.indexOf('sw_oauth=');
            var fragStr = fragRaw.substring(idx + 'sw_oauth='.length);
            var parsed = JSON.parse(decodeURIComponent(fragStr));
            if (parsed && parsed.code && parsed.state) {
              stored = { code: parsed.code, state: parsed.state };
              console.log('SW OAuth: captured params from fragment');
            }
          }
        } catch(e) {}
        if (stored) {
          try {
            window.__SW_OAUTH__ = stored;
            if (window.sessionStorage && window.sessionStorage.setItem) {
              window.sessionStorage.setItem('SW_OAUTH', JSON.stringify(stored));
            }
            // Clean URL to path-only to prevent any auto OAuth handlers from triggering
            history.replaceState({}, document.title, window.location.pathname);
          } catch (e) {}
        }
      }
    })();
  </script>

  <!-- Service Worker Registration -->
  <script>
    (function() {
      const isCallbackRoute = window.location.pathname === '/smartwallet-oauth';
      if (isCallbackRoute) {
        console.log('SW: Skipping service worker registration on /smartwallet-oauth');
        if ('serviceWorker' in navigator) {
          // Unregister any existing SWs and clear caches to avoid interference
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(reg) { reg.unregister(); });
            console.log('SW: Unregistered existing service workers');
          });
          if (window.caches && caches.keys) {
            caches.keys().then(function(keys) {
              Promise.all(keys.map(function(k){ return caches.delete(k); }))
                .then(function(){ console.log('SW: Cleared caches'); })
                .catch(function(){ /* ignore */ });
            });
          }
        }
      }
      if ('serviceWorker' in navigator && !isCallbackRoute) {
        window.addEventListener('flutter-first-frame', function() {
          // Register service worker normally without dynamic versioning
          navigator.serviceWorker.register('/flutter_service_worker.js')
            .then(function(registration) {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
              
              // Handle service worker updates only when there's an actual update
              registration.addEventListener('updatefound', function() {
                const newWorker = registration.installing;
                
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New content is available - update silently in background
                    console.log('New content is available and will be applied on next visit.');
                    
                    // Tell the new service worker to skip waiting and take control silently
                    newWorker.postMessage({ action: 'skipWaiting' });
                    
                    // No intrusive popup - just update automatically in background
                    navigator.serviceWorker.addEventListener('controllerchange', function() {
                      // Update will be available on next page load
                      console.log('Service worker updated successfully');
                    });
                  }
                });
              });
            })
            .catch(function(error) {
              console.log('ServiceWorker registration failed: ', error);
            });
        });
      }
      
      // Handle installation prompt for Android
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', function(e) {
        // Prevent Chrome 67 and earlier from automatically showing the prompt
        e.preventDefault();
        // Stash the event so it can be triggered later
        deferredPrompt = e;
        console.log('PWA install prompt available');
        
        // Optional: Show your own install promotion UI here
        // You could show a custom banner or button to prompt installation
      });
      
      // Handle successful installation
      window.addEventListener('appinstalled', function(e) {
        console.log('PWA installed successfully');
        deferredPrompt = null;
      });
    })();
    
    // Production: keep service worker caches for offline functionality.
    // If you need to force clear caches during debugging, use DevTools > Application > Clear storage.
    
    // Detect if running as PWA (standalone mode)
    function isPWA() {
      return window.matchMedia('(display-mode: standalone)').matches || 
             window.navigator.standalone === true;
    }
    
    // Optional: Show install instructions for iOS Safari users
    function showIOSInstallInstructions() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isInStandaloneMode = window.navigator.standalone;
      
      if (isIOS && !isInStandaloneMode) {
        // You could show a banner here explaining how to install on iOS
        console.log('iOS user detected - can show install instructions');
      }
    }
    
    window.addEventListener('load', function() {
      showIOSInstallInstructions();
    });
  </script>
